name: HEDEFLERİN YOLUNDA otomatik paylaşım

on:
  schedule:
    # Saatler UTC'dir (Bakü = UTC+4). Her saat 10 dk önce hazırlanır, tam saatinde paylaşılır; 30 dk sonra yedek tetikleme.
    # Hafta içi Bakü 12:00, 17:00, 22:00
    - cron: "50 7,12,17 * * 1-5"
    - cron: "25 8,13,18 * * 1-5"
    # Hafta sonu Bakü 11:00, 15:00, 19:00, 22:00
    - cron: "50 6,10,14,17 * * 0,6"
    - cron: "25 7,11,15,18 * * 0,6"
  workflow_dispatch:
    inputs:
      kap_id:
        description: "Instagram'da hazır bekleyen kap ID'si (boş bırak = normal paylaşım)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: oza-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri ve yazı tipini kur
        run: |
          pip install requests pillow numpy imageio-ffmpeg
          curl -sSL -o Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf

      - name: İçeriği seç, üret ve 4 kalite denetiminden geçir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.kap_id }}" ]; then echo "Hazır kap yayınlanacak"; else python reels.py hazirla; fi

      - name: Görseli depoya yükle (görsel gönderiyse)
        id: gorsel
        run: |
          git config user.name "oza-bot"
          git config user.email "oza-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain gorseller 2>/dev/null)" ]; then
            git add gorseller
            git commit -m "Yeni görsel gönderi"
            git pull --rebase
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            sleep 15
          fi

      - name: Kontrol için çıktıyı sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cikti
          path: cikti_reels/
          if-no-files-found: ignore
          retention-days: 7

      - name: Instagram'a paylaş
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          GORSEL_SHA: ${{ steps.gorsel.outputs.sha }}
        run: |
          if [ -n "${{ inputs.kap_id }}" ]; then python reels.py yayinla "${{ inputs.kap_id }}"; else python reels.py paylas; fi

      - name: Durumu kaydet
        if: always()
        run: |
          git add reels_durum.json 2>/dev/null || true
          git commit -m "Paylaşım kaydı" || true
          git pull --rebase || true
          git push || true
