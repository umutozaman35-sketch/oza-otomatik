name: OZA BİLGİ otomatik paylaşım

on:
  schedule:
    - cron: "7 4-18/2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oza-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: pip install requests pillow
      - name: Bilgiyi yaz ve kartı üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py hazirla
      - name: Deneme kartını kaydet
        if: vars.DRY_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: deneme-karti
          path: cikti/*.jpg
      - name: Görseli depoya yükle
        id: gorsel
        run: |
          if [ -f cikti/bekleyen.json ]; then
            git config user.name "oza-bot"
            git config user.email "oza-bot@users.noreply.github.com"
            git add cikti
            git commit -m "Yeni gönderi görseli"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "var=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Instagram'a paylaş
        if: steps.gorsel.outputs.var == '1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          GORSEL_SHA: ${{ steps.gorsel.outputs.sha }}
        run: |
          sleep 15
          python main.py paylas
      - name: Durumu kaydet
        if: steps.gorsel.outputs.var == '1'
        run: |
          git add -A paylasilanlar.json cikti
          git commit -m "Paylaşım kaydı" || true
          git push
